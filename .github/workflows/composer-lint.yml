name: "Composer Lint"

on:
  pull_request:
    branches:
      - "*.x"
    paths:
      - ".github/workflows/composer-lint.yml"
      - "composer.json"
  push:
    branches:
      - "*.x"
    paths:
      - ".github/workflows/composer-lint.yml"
      - "composer.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  composer-lint:
    name: "Composer Lint"
    uses: "doctrine/.github/.github/workflows/composer-lint.yml@16.1.0"
