name: "Documentation"

on:
  pull_request:
    branches:
      - "*.x"
    paths:
      - ".github/workflows/documentation.yml"
      - "docs/**"
  push:
    branches:
      - "*.x"
    paths:
      - ".github/workflows/documentation.yml"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  documentation:
    name: "Documentation"
    uses: "doctrine/.github/.github/workflows/documentation.yml@15.1.0"
